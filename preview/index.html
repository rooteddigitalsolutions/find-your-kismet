<!DOCTYPE html>

<head>

  <title>Color of Kismet — Find Your Kismet (Preview)</title>
  <!--
    This page MOCKS a Squarespace page so you can see the widget in context.
    The real embed is just the two lines inside <div id="kismet-quiz"> below —
    everything else here is fake site chrome (header/footer/column) to prove the
    widget behaves inside a ~1100px centered content column.
  -->
  <style>
    :root { --demo-ink: #1c1c1a; --demo-cream: #f6f4ee; --demo-line: #e6e2d8; --demo-slate: #5e7385; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Epilogue', ui-sans-serif, system-ui, sans-serif; color: var(--demo-ink); background: #fff; }
    .demo-header {
      border-bottom: 1px solid var(--demo-line);
      padding: 22px 32px; display: flex; align-items: center; justify-content: space-between;
    }
    .demo-logo { font-family: 'Afacad', serif; font-weight: 700; font-size: 1.35rem; letter-spacing: 0.02em; }
    .demo-nav a { color: var(--demo-ink); text-decoration: none; margin-left: 26px; font-size: 0.9rem; }
    .demo-nav a:hover { color: var(--demo-slate); }
    .demo-hero { background: var(--demo-cream); text-align: center; padding: 64px 24px 40px; }
    .demo-hero h1 { font-family: 'Afacad', serif; font-weight: 700; font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 10px; }
    .demo-hero p { color: #6b6f6c; max-width: 560px; margin: 0 auto; }
    .demo-column { max-width: 1100px; margin: 0 auto; padding: 48px 24px 72px; }
    .demo-footer { border-top: 1px solid var(--demo-line); padding: 40px 32px; text-align: center; color: #6b6f6c; font-size: 0.85rem; background: var(--demo-cream); }
    .demo-note { max-width: 1100px; margin: 0 auto; padding: 10px 24px; font-size: 0.78rem; color: #9a9a92; }
  </style>
</head>
<body>
  <header class="demo-header">
    <div class="demo-logo">Color of Kismet</div>
    <nav class="demo-nav">
      <a href="#">Shop</a>
      <a href="#">Blends</a>

      <a href="#">Journal</a>
    </nav>
  </header>

  <section class="demo-hero">
